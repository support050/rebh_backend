<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TASI Market Breadth</title>
<style>
:root{--bg:#fcfcfb;--surface:#ffffff;--surface2:#f4f4f2;--text:#0b0b0b;--text2:#52514e;--grid:#e6e5e1;--border:#dcdbd6;
 --blue:#2a78d6;--orange:#eb6834;--aqua:#1baf7a;--yellow:#eda100;--magenta:#e87ba4;--green:#008300;--violet:#4a3aa7;--red:#e34948;
 --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--critical:#d03b3b;--up:#1baf7a;--down:#e34948;--zone-hi:rgba(227,73,72,.10);--zone-lo:rgba(27,175,122,.12);--episode:rgba(227,73,72,.13)}
:root[data-theme="dark"]{--bg:#111110;--surface:#1a1a19;--surface2:#232322;--text:#ffffff;--text2:#c3c2b7;--grid:#2c2c2a;--border:#333331;
 --blue:#3987e5;--orange:#d95926;--aqua:#199e70;--yellow:#c98500;--magenta:#d55181;--green:#008300;--violet:#9085e9;--red:#e66767;--up:#199e70;--down:#e66767;
 --zone-hi:rgba(230,103,103,.14);--zone-lo:rgba(25,158,112,.16);--episode:rgba(230,103,103,.16)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 "Segoe UI",Inter,Roboto,Arial,sans-serif}
header{display:flex;align-items:center;gap:18px;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;font-weight:700}
header .sub{color:var(--text2);font-size:12px}
header .sp{flex:1}
.btn{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
.btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.layout{display:flex;min-height:calc(100vh - 52px)}
nav{width:190px;border-right:1px solid var(--border);background:var(--surface);padding:10px 0;flex-shrink:0}
nav a{display:block;padding:8px 16px;color:var(--text2);text-decoration:none;cursor:pointer;border-left:3px solid transparent}
nav a.active{color:var(--text);border-left-color:var(--blue);background:var(--surface2);font-weight:600}
main{flex:1;padding:14px 18px;min-width:0}
.page{display:none}.page.active{display:block}
h2{font-size:15px;margin:6px 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.kpi .l{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px}
.kpi .d{font-size:12px;color:var(--text2)}
.badge{display:inline-block;padding:3px 10px;border-radius:14px;color:#fff;font-weight:700;font-size:13px}
.toolbar{display:flex;gap:6px;align-items:center;margin:6px 0 8px;flex-wrap:wrap}
.toolbar .lbl{color:var(--text2);font-size:12px;margin-right:4px}
.stack{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:14px}
.panel{position:relative;border-bottom:1px solid var(--border)}
.panel:last-child{border-bottom:none}
.panel canvas{display:block;width:100%}
.panel .ttl{position:absolute;left:10px;top:6px;font-size:12px;color:var(--text2);pointer-events:none;display:flex;gap:12px;flex-wrap:wrap}
.panel .ttl b{color:var(--text)}
.panel .ttl .lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
.tip{position:fixed;z-index:20;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 9px;font-size:12px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none;min-width:160px}
.tip b{display:block;margin-bottom:3px}
.tip .r{display:flex;justify-content:space-between;gap:14px}
.tip .r span:last-child{font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:12px;background:var(--surface)}
th,td{border:1px solid var(--border);padding:4px 7px;text-align:right;font-variant-numeric:tabular-nums}
th{background:var(--surface2);color:var(--text2);font-weight:600;position:sticky;top:0}
td:first-child,th:first-child{text-align:left}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}nav{width:140px}}
.note{color:var(--text2);font-size:12px;margin:4px 0 12px}
.q{display:grid;grid-template-columns:260px 1fr 180px;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface);margin-bottom:12px}
.q div{padding:7px 10px;border-bottom:1px solid var(--border)}
.q div:nth-child(3n+1){font-weight:600;background:var(--surface2)}
.q div:nth-child(3n){font-weight:700}
.pos{color:var(--up)}.neg{color:var(--down)}
.heat td{text-align:center;padding:3px 4px}
.heat td.c{color:#fff}
.tblwrap{overflow:auto;max-height:520px;border:1px solid var(--border);border-radius:8px}
footer{color:var(--text2);font-size:11px;padding:12px 0;border-top:1px solid var(--border);margin-top:10px}
.ovgrid{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
@media(max-width:1100px){.ovgrid{grid-template-columns:1fr}}
.widget{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.widget h3{margin:0 0 10px;font-size:13px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.wrow{margin-bottom:12px}
.wrow .h{display:flex;justify-content:space-between;font-weight:600;font-size:13px}
.wrow .h .p{font-weight:700}
.wbar{height:8px;border-radius:4px;background:var(--surface2);margin:5px 0 4px;overflow:hidden;display:flex}
.wbar i{display:block;height:100%}
.wrow .c{display:flex;justify-content:space-between;color:var(--text2);font-size:12px}
.stg{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:6px 0}
.stg i{display:block;height:100%}
.stgl{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11px;color:var(--text2);text-align:center}
.stgl b{display:block;color:var(--text);font-size:12px}
.stgl .sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;vertical-align:middle}
#tour-dim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:14px}
.card .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card .hd h3{margin:0;font-size:13px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.card .hd .sp{flex:1}
.theme{display:grid;grid-template-columns:200px 1fr 70px;gap:6px 10px;align-items:center;font-size:12px}
.theme .bar{position:relative;height:9px;background:var(--surface2);border-radius:4px}
.theme .bar i{position:absolute;top:0;height:100%;border-radius:4px}
.theme .bar:before{content:'';position:absolute;left:50%;top:-2px;height:13px;border-left:1px solid var(--border)}
.theme .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.theme .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ranks td{text-align:center}.ranks td:first-child{text-align:left}
.ranks .r1,.ranks .r2,.ranks .r3{color:var(--up);font-weight:700}.ranks .rl{color:var(--down);font-weight:700}
.ranks sup{font-size:9px;margin-left:2px}.ranks sup.up{color:var(--up)}.ranks sup.dn{color:var(--down)}
tr.secrow{cursor:pointer}tr.secrow:hover td,tr.secrow:hover th{filter:brightness(1.15)}
tr.secrow td:first-child:before{content:'▸ ';color:var(--text2)}tr.secrow.open td:first-child:before{content:'▾ '}
tr.drill td{padding:0;background:var(--surface2)}
.drill table{font-size:12px}.drill th{position:static;background:var(--surface)}.drill td{text-align:right;padding:3px 7px}.drill td:first-child,.drill td:nth-child(2){text-align:left}
.stg-b{display:inline-block;width:18px;text-align:center;border-radius:4px;color:#fff;font-weight:700;font-size:11px}
.theme .n,.ranks td:first-child{cursor:pointer}.theme .n:hover,.ranks td:first-child:hover{color:var(--blue);text-decoration:underline}
.tour-hl{position:relative;z-index:31;box-shadow:0 0 0 3px var(--blue),0 0 0 6px rgba(57,135,229,.35);border-radius:8px}
#tour{position:fixed;z-index:32;width:380px;max-width:calc(100vw - 24px);background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.4);display:none;font-size:13px;line-height:1.55}
#tour h4{margin:0 0 6px;font-size:14px}
#tour .step{color:var(--text2);font-size:11px;margin-bottom:6px}
#tour .btns{display:flex;gap:6px;margin-top:10px;align-items:center}
#tour .btns .sp{flex:1}
#tour kbd{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:0 4px;font-size:11px}
th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--text)}th.sortable.asc:after{content:' ▲';font-size:9px}th.sortable.desc:after{content:' ▼';font-size:9px}
.tblbar{display:flex;gap:6px;align-items:center;margin:4px 0 6px;flex-wrap:wrap}.tblbar input{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:12px;width:180px}
.sym{color:var(--blue);cursor:pointer;font-weight:600}.sym:hover{text-decoration:underline}
#modal-dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
#modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1100px,calc(100vw - 30px));max-height:calc(100vh - 30px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:0 12px 40px rgba(0,0,0,.5);display:none}
#modal .hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}#modal .hd h3{margin:0;font-size:15px}#modal .hd .sp{flex:1}
.sb td.g{background:rgba(27,175,122,.22)}.sb td.r{background:rgba(227,73,72,.22)}.sb td.k{cursor:pointer}.sb td.k:hover{outline:1px solid var(--blue)}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;color:#fff;margin-left:4px}
.alert{border-left:4px solid var(--serious);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:12px}
.help{display:inline-block;margin-left:8px;width:18px;height:18px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);color:var(--text2);text-align:center;line-height:16px;font-size:11px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>TASI Market Breadth</h1>
  <span class="sub" id="hdr-date"></span>
  <span class="sp"></span>
  <span class="sub">Local · offline · not published</span>
  <button class="btn" id="tour-btn" style="background:var(--blue);color:#fff;border-color:var(--blue)">▶ Guided tour</button>
  <button class="btn" id="theme">Light theme</button>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="tip" id="tip"></div>
<div id="tour-dim"></div>
<div id="modal-dim" onclick="closeModal()"></div><div id="modal"></div>
<div id="tour"></div>
<script>
/*__DATA__*/
/* ===================================================================== helpers */
const $=(s,el=document)=>el.querySelector(s);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const N=DATA.dates.length, S=DATA.series;
const fmt=(v,d=0)=>v==null?'—':v.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const dateIdx={}; DATA.dates.forEach((d,i)=>dateIdx[d]=i);
const REG={Strong:'--good',Healthy:'--good',Neutral:'--text2',Weak:'--serious',Washout:'--violet'};
const REGICON={Strong:'▲▲',Healthy:'▲',Neutral:'●',Weak:'▼',Washout:'◆'};
function nice(v){const e=Math.pow(10,Math.floor(Math.log10(Math.abs(v)||1)));const f=v/e;return (f<1.5?1:f<3.5?2:f<7.5?5:10)*e}
function ticks(lo,hi,n=5){const st=nice((hi-lo)/n);const a=Math.ceil(lo/st)*st,out=[];for(let v=a;v<=hi+1e-9;v+=st)out.push(+v.toFixed(10));return out}
const rangeState={i0:Math.max(0,N-500),i1:N-1};
const stacks=[];
function setRange(days){rangeState.i1=N-1;rangeState.i0=days==null?0:Math.max(0,N-days);stacks.forEach(s=>s.draw());document.querySelectorAll('.rng').forEach(b=>b.classList.toggle('active',b.dataset.d==String(days)))}
/* ===================================================================== chart engine */
class Stack{
  constructor(el,panels,opts={}){this.el=el;this.panels=panels;this.opts=opts;this.hover=null;el.classList.add('stack');
    panels.forEach(p=>{const d=document.createElement('div');d.className='panel';d.style.height=(p.height||150)+'px';
      const c=document.createElement('canvas');d.appendChild(c);const t=document.createElement('div');t.className='ttl';
      t.innerHTML=`<b>${p.title||''}</b>`+p.series.map(s=>`<span class="lg"><i style="background:${css(s.color)}"></i>${s.label||s.key}</span>`).join('');if(!p.mini)d.appendChild(t);el.appendChild(d);p.canvas=c;p.div=d;
      c.addEventListener('mousemove',e=>this.onMove(e,p));c.addEventListener('mouseleave',()=>{this.hover=null;$('#tip').style.display='none';this.draw()});
      c.addEventListener('wheel',e=>{e.preventDefault();this.zoom(e.deltaY>0?1.2:1/1.2,this.xIndex(e,p))},{passive:false});
      c.addEventListener('mousedown',e=>{this.drag={x:e.clientX,i0:rangeState.i0,i1:rangeState.i1}});
      window.addEventListener('mouseup',()=>this.drag=null);
      c.addEventListener('mousemove',e=>{if(!this.drag)return;const w=this.plotW(p);const n=rangeState.i1-rangeState.i0;const di=Math.round(-(e.clientX-this.drag.x)/w*n);let a=this.drag.i0+di,b=this.drag.i1+di;if(a<0){b-=a;a=0}if(b>N-1){a-=b-(N-1);b=N-1}rangeState.i0=a;rangeState.i1=b;stacks.forEach(s=>s.draw())});
    });stacks.push(this);new ResizeObserver(()=>this.draw()).observe(el)}
  L(p){return p&&p.mini?34:62}R(){return 12}T(p){return p&&p.mini?4:24}B(p){return p.last?(p.mini?14:22):6}
  plotW(p){return p.canvas.clientWidth-this.L(p)-this.R()}
  xIndex(e,p){const r=p.canvas.getBoundingClientRect();const x=e.clientX-r.left-this.L(p);const n=rangeState.i1-rangeState.i0;return Math.max(rangeState.i0,Math.min(rangeState.i1,Math.round(rangeState.i0+x/this.plotW(p)*n)))}
  zoom(f,center){const n=rangeState.i1-rangeState.i0;let nn=Math.max(30,Math.min(N-1,Math.round(n*f)));const frac=(center-rangeState.i0)/n;let a=Math.round(center-frac*nn),b=a+nn;if(a<0){a=0;b=nn}if(b>N-1){b=N-1;a=b-nn}rangeState.i0=a;rangeState.i1=b;stacks.forEach(s=>s.draw())}
  onMove(e,p){if(this.drag)return;const i=this.xIndex(e,p);this.hover=i;stacks.forEach(s=>{s.hover=i;s.draw()});
    const tip=$('#tip');let h=`<b>${DATA.dates[i]}${S.regime[i]?' · '+S.regime[i]:''}</b>`;
    this.panels.forEach(pp=>pp.series.forEach(s=>{const v=S[s.key][i];h+=`<div class="r"><span><i style="display:inline-block;width:8px;height:8px;background:${css(s.color)};border-radius:2px;margin-right:4px"></i>${s.label||s.key}</span><span>${fmt(v,s.dec??(Math.abs(v||0)<10?2:0))}</span></div>`}));
    tip.innerHTML=h;tip.style.display='block';const tw=tip.offsetWidth;tip.style.left=Math.min(e.clientX+14,window.innerWidth-tw-10)+'px';tip.style.top=(e.clientY+14)+'px'}
  draw(){const {i0,i1}=rangeState;this.panels.forEach((p,k)=>{p.last=k===this.panels.length-1;this.drawPanel(p,i0,i1)})}
  drawPanel(p,i0,i1){const c=p.canvas,dpr=window.devicePixelRatio||1,W=c.clientWidth,H=p.div.clientHeight;c.width=W*dpr;c.height=H*dpr;const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
    const L=this.L(p),R=this.R(),T=this.T(p),B=this.B(p),pw=W-L-R,ph=H-T-B;const n=i1-i0;const X=i=>L+(i-i0)/Math.max(1,n)*pw;
    const cache={};const arr=s=>{if(!p.rebase)return S[s.key];if(cache[s.key])return cache[s.key];const a=S[s.key];let b=null;for(let i=i0;i<=i1;i++){if(a[i]!=null){b=a[i];break}}const out=new Array(a.length);for(let i=i0;i<=i1;i++)out[i]=(a[i]==null||b==null)?null:100*a[i]/b;return cache[s.key]=out};
    g.fillStyle=css('--surface');g.fillRect(0,0,W,H);
    // y range
    let lo=Infinity,hi=-Infinity;p.series.forEach(s=>{const a=arr(s);for(let i=i0;i<=i1;i++){const v=a[i];if(v==null)continue;if(v<lo)lo=v;if(v>hi)hi=v}
      if(s.type==='candle'){for(let i=i0;i<=i1;i++){const l=S.tasi_l[i],h=S.tasi_h[i];if(l!=null&&l<lo)lo=l;if(h!=null&&h>hi)hi=h}}});
    if(p.ylim){lo=p.ylim[0];hi=p.ylim[1]}if(!isFinite(lo)){lo=0;hi=1}if(p.zero&&lo>0)lo=0;if(p.zero&&hi<0)hi=0;
    if(!p.ylim){const pad=(hi-lo)*0.06||1;lo-=pad;hi+=pad}
    const Y=v=>T+ph-(v-lo)/(hi-lo)*ph;
    // zones
    (p.zones||[]).forEach(z=>{g.fillStyle=css(z.color);const y1=Y(Math.min(z.to,hi)),y2=Y(Math.max(z.from,lo));if(y2>y1)g.fillRect(L,y1,pw,y2-y1)});
    // episodes (canary)
    if(p.episodes){g.fillStyle=css('--episode');DATA.events.canary.forEach(ep=>{const a=dateIdx[ep.start],b=dateIdx[ep.end];if(a==null||b==null||b<i0||a>i1)return;g.fillRect(X(Math.max(a,i0)),T,X(Math.min(b,i1))-X(Math.max(a,i0)),ph)})}
    // grid + y ticks
    g.strokeStyle=css('--grid');g.lineWidth=1;g.font='10px sans-serif';g.fillStyle=css('--text2');g.textAlign='right';
    ticks(lo,hi,p.height>200?6:4).forEach(v=>{const y=Y(v);g.beginPath();g.moveTo(L,y);g.lineTo(L+pw,y);g.stroke();g.fillText(fmt(v,Math.abs(hi-lo)<5?2:0),L-6,y+3)});
    (p.hlines||[]).forEach(h=>{if(h.y<lo||h.y>hi)return;g.strokeStyle=css(h.color||'--text2');g.setLineDash(h.dash||[4,3]);g.beginPath();g.moveTo(L,Y(h.y));g.lineTo(L+pw,Y(h.y));g.stroke();g.setLineDash([]);if(h.label){g.textAlign='left';g.fillStyle=css(h.color||'--text2');g.fillText(h.label,L+4,Y(h.y)-3);g.textAlign='right'}});
    // x ticks
    if(p.last){g.textAlign='center';g.fillStyle=css('--text2');const step=n>2500?250:n>1200?125:n>500?63:n>200?21:n>60?10:5;let lastLab='';for(let i=i0;i<=i1;i++){const d=DATA.dates[i];const lab=n>500?d.slice(0,4):d.slice(0,7);if(lab!==lastLab&&(n<=500||d.slice(5,7)==='01')){if(n>500&&lab===lastLab)continue;lastLab=lab;if(i-i0<step/3&&i!==i0)continue;g.strokeStyle=css('--grid');g.beginPath();g.moveTo(X(i),T);g.lineTo(X(i),T+ph);g.stroke();g.fillText(lab,X(i),H-6)}}}
    // series
    g.save();g.beginPath();g.rect(L,T,pw,ph);g.clip();
    const bw=Math.max(1,pw/Math.max(1,n)-1);
    p.series.forEach(s=>{const a=arr(s);const col=css(s.color);
      if(s.type==='hist'){for(let i=i0;i<=i1;i++){const v=a[i];if(v==null)continue;g.fillStyle=v>=0?css(s.up||'--up'):css(s.down||'--down');const y0=Y(0),y=Y(v);g.fillRect(X(i)-bw/2,Math.min(y0,y),bw,Math.max(1,Math.abs(y0-y)))}}
      else if(s.type==='bar'){g.fillStyle=col;const cb=s.colorBy?S[s.colorBy]:null;for(let i=i0;i<=i1;i++){const v=a[i];if(v==null)continue;if(cb)g.fillStyle=css((cb[i]??0)>=0?'--up':'--down');const y0=Y(Math.max(lo,0)),y=Y(v);g.fillRect(X(i)-bw/2,Math.min(y0,y),bw,Math.max(1,Math.abs(y0-y)))}}

 <h2>Method (one screen)</h2>
 <div class="note" style="font-size:13px;line-height:1.7">
 <b>Universe</b>: TASI main-market common stocks (${t.n_universe} today), no REITs/NOMU/ETFs; delisted names kept for their history; adjusted prices; suspension days excluded (never "unchanged"); a stock enters a metric only after its full lookback. Official TASI from 2007, own Equal-Weight TASI from 2002.<br>
 <b>Score</b> = ⅓ participation (%>200DMA, %>50DMA, High-Low Index) + ⅓ advance/decline (McClellan, A/D line 20d change) + ⅓ sectors (% healthy, median score), each metric percentile-ranked against its own trailing 5 years (no look-ahead). Weights were fitted in-sample and then <b>rejected</b> by walk-forward — equal weights won; concentration and divergence families were dropped from the score (they reversed the quintile spread) and kept as context.<br>
 <b>Regimes</b>: 40/60/75 on a 5-day EMA of the score, hysteresis 8, min 5 days. Washout = score ≤45 and oversold overlay ≥75 (TRIN-10, 4% ratio, panic days, 95% down day, recent thrust).<br>
 <b>Hisham Naser references</b>: NH−NL canary (5 negative days + 5d sum threshold), McClellan extremes, %>MA 20/80 bands, "wait for 5 consecutive positive days", "NH−NL under zero 55–60 days → bear market". All re-calibrated on TASI and reported with their forward returns.<br>
 <b>Validation</b>: in-sample 2008–2017, out-of-sample 2018–2026, yearly walk-forward 2014–2026; 28 unit tests; Excel workbooks reproduce every value by formula.<br>
 <b>Expert-review additions (Sep-2026)</b>: Minervini trend template + RS rating (1–99) + leaders list and new highs on volume; Weinstein stages on weekly bars with breakout-volume and RS line per stock; Stockbee colour rules and name lists; Lowry points/volume split and sequence test; McClellan Summation percentiles and automatic divergence marks; Deepvue cycle on 21 and 50 days; rare Zweig/Deemer variants tested and reported; sortable/filterable/CSV tables and in-page stock charts; "near canary" alert; confirmation rule rewritten as index direction vs breadth direction. <b>Outside the data</b>: liquidity / rates (Zweig's monetary filter) — not in these files; read SAIBOR and the repo rate separately.</div>
 <footer>TASI Breadth Engine · local file · generated ${t.date}</footer>`}

 {page:'cycle',sel:'#cy-stack',title:'Market Cycle (Deepvue-style) — 21-day and 50-day',text:'Green bars count the days TASI has closed above its 21-day SMA (switch to the 50-day for the intermediate cycle), red bars the days below. A long green run = established uptrend; the first red bars after a long run = the cycle turning. Orange dots mark stress tests — short dips the trend survived. Use it with the Breadth Score: a fresh green count with a rising score is the healthiest combination.'},
 {page:'cycle',sel:'#cy-board',title:'Breadth board',text:'Twelve mini-histograms of the core breadth series over the last 250 days, each with today\'s value — the quick-glance board.'},
 {page:'classic',sel:'#cl-stack',title:'Classic StockCharts layout',text:'The layout Hisham uses for the US total market: price with EMA21 / MA50 / MA200, volume coloured by direction, NH−NL, and the McClellan Oscillator in both the traditional and ratio-adjusted forms — now on TASI.'},
 {page:'library',sel:'#tbl-lib',title:'Classic breadth library — the rest of the literature, tested',text:'Fosback\'s High-Low Logic Index and Absolute Breadth Index, the Hindenburg Omen, Titanic Syndrome, Swenlin\'s STO and ITBM, the McClellan Volume Oscillator, CVI, Zweig\'s 9:1 days, new-high % and A/D %. Each row shows today\'s value, TASI percentiles and the verdict from the 2007–2026 test. The one that matters most: <b>HLLI above 1 (split market) is the strongest negative state on TASI</b> — it now feeds the Overview alert.'},
 {page:'bpi',sel:'#bpi-stack',title:'Bullish Percent Index (Point & Figure)',text:'Dorsey\'s classic: the share of stocks on a P&F buy signal (2% boxes, 3-box reversal), with the six BPI statuses derived from a P&F chart of the index itself. On TASI the level (30/70) carries no edge but the status does — Bull Alert has been the best entry state, Bear Alert the worst.'},
 {page:'sectors',sel:'#theme-card',title:'Theme Tracker',text:'Equal-weight return of every industry group over Today / 1W / 1M / 3M / 6M / 12M / YTD, sorted best to worst, bars diverging from zero (blue up, magenta down). The footer shows the equal-weight market return for the same period so you can see who leads and who lags.'},
 {page:'sectors',sel:'#ranks-card',title:'Industry Ranks',text:'Each group ranked by its return over 1M / 3M / 6M / 12M (1 = best). The small superscript is the rank change versus one month ago — a group climbing across horizons is emerging leadership; a top-3 12M group sliding in 1M/3M is rotation out. Sort by any horizon.'},
 {page:'sectors',sel:'#p-sectors .tblwrap:last-of-type',title:'Sector heatmap — click to drill down',text:'Each industry group gets a health score (mean of %>50DMA, %>200DMA, normalised NH−NL and 10-day A/(A+D)). Green ≥ 60 healthy, red ≤ 40 weak. When 50–70% of sectors are healthy the market averaged +3.8% over 60 days (82% hit); a median above 75 has been exhaustion.'},
 {page:'conc',sel:'#cc-stack .panel:nth-child(2)',title:'Concentration — does the index hide weakness?',text:'Equal-Weight TASI vs the cap-weighted TASI. When the broad market lags the index by more than 5 points over 60 days (below the red line), the following 60 days averaged −0.6% with a 43% hit rate — the only negative state in the whole engine. This is the “Aramco and the banks mask the weakness” signal.'},
 {page:'signals',sel:'#tbl-sigstats',title:'Every rule judged by its own record',text:'One row per rule: independent signal count, mean forward return and hit rate at 20/60/120 days, the horizon on which it is valid, and its status (scored · indicative · tested-no-edge · dropped). Rows with fewer than 30 events are flagged — they are not proof. The rare Zweig / Deemer variants and the Lowry sequence asked for in the expert review are here with their results.'},
 {page:'signals',sel:'#p-signals .grid2',title:'Signal log & regimes',text:'Left: every signal in history with TASI’s forward returns (grey rows = tested variants kept for audit); sort, filter and export. Right: the regime log. Below, the Zweig EMA (0.40 → 0.615 within 10 days, 0.66 rare line) and the score/overlay pair that define Washout.'},
 {page:'thr',sel:'#p-thr .tblwrap',title:'Thresholds — TASI vs the US reference values',text:'Percentile-based extremes computed on TASI 2007–2026, next to the US numbers Hisham uses (StockCharts, Refinitiv, his own data). Use these, not the US levels, when you read TASI.'},
 {page:'thr',sel:'#p-thr .note',title:'Method in one screen — and you are done',text:'Universe, adjustments, scoring, regimes and validation are summarised here. Daily routine: drop the two CSV exports into <code>storage/raw</code>, run <code>python -m breadth.daily</code>, open this file. Press <kbd>Esc</kbd> to close, or restart the tour any time from the header.'}

let tourI=-1,tourEl=null;
function tourStop(){tourI=-1;if(tourEl)tourEl.classList.remove('tour-hl');tourEl=null;$('#tour').style.display='none';$('#tour-dim').style.display='none'}
function tourGo(i){if(i<0||i>=TOUR.length)return tourStop();const st=TOUR[i];if(tourEl)tourEl.classList.remove('tour-hl');show(st.page);tourI=i;
  const el=$(st.sel);tourEl=el;if(el){el.classList.add('tour-hl');el.scrollIntoView({block:'center',behavior:'smooth'})}
  const box=$('#tour');box.innerHTML=`<div class="step">Step ${i+1} of ${TOUR.length} · ${PAGES.find(p=>p[0]===st.page)[1]}</div><h4>${st.title}</h4><div>${st.text}</div>
   <div class="btns"><button class="btn" onclick="tourGo(${i-1})" ${i===0?'disabled':''}>← Back</button><button class="btn" style="background:var(--blue);color:#fff;border-color:var(--blue)" onclick="tourGo(${i+1})">${i===TOUR.length-1?'Finish':'Next →'}</button><span class="sp"></span><button class="btn" onclick="tourStop()">Skip</button></div>`;
  box.style.display='block';$('#tour-dim').style.display='block';
  setTimeout(()=>{if(!el){box.style.left='50%';box.style.top='20%';box.style.transform='translateX(-50%)';return}box.style.transform='';const r=el.getBoundingClientRect();const bw=box.offsetWidth,bh=box.offsetHeight;
    let left=r.right+14,top=r.top;if(left+bw>window.innerWidth-10){left=Math.max(10,r.left);top=r.bottom+12}if(top+bh>window.innerHeight-10)top=Math.max(10,window.innerHeight-bh-10);if(top<10)top=10;box.style.left=left+'px';box.style.top=top+'px'},350)}
$('#tour-btn').onclick=()=>tourGo(0);
document.addEventListener('keydown',e=>{if(tourI<0)return;if(e.key==='Escape')tourStop();if(e.key==='ArrowRight')tourGo(tourI+1);if(e.key==='ArrowLeft')tourGo(tourI-1)});
$('#tour-dim').onclick=tourStop;
/* per-page help buttons: jump into the tour at that page */
PAGES.forEach(([id])=>{const h=$('#p-'+id+' h2');if(!h)return;const b=document.createElement('span');b.className='help';b.textContent='?';b.title='Explain this page';b.onclick=()=>{const k=TOUR.findIndex(s=>s.page===id);if(k>=0)tourGo(k)};h.appendChild(b)});
/* first visit: offer the tour */
try{if(!localStorage.getItem('tb-toured')){localStorage.setItem('tb-toured','1');setTimeout(()=>tourGo(0),600)}}catch(e){}

/* ===================================================================== init */
$('#hdr-date').textContent='as of '+t.date;
$('#theme').onclick=()=>{const r=document.documentElement;const d=r.dataset.theme==='dark';r.dataset.theme=d?'light':'dark';$('#theme').textContent=d?'Dark theme':'Light theme';try{localStorage.setItem('tb-theme',r.dataset.theme)}catch(e){}stacks.forEach(s=>s.draw())};
try{const th=localStorage.getItem('tb-theme');if(th){document.documentElement.dataset.theme=th;$('#theme').textContent=th==='dark'?'Light theme':'Dark theme'}}catch(e){}
let start='overview';try{start=localStorage.getItem('tb-page')||'overview'}catch(e){}
show(start);setRange(504);
</script>
